name: Deliver Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youpi-observer-apk
          path: "**/*.apk"
          if-no-files-found: error
